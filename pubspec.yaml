name: ais_package_store
description: AIS Package Store Demo with LaunchDarkly Feature Flags
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # LaunchDarkly Flutter Client SDK
  launchdarkly_flutter_client_sdk: ^4.0.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Thai Font Support
  google_fonts: ^6.2.1

  # Charts for Experimentation
  fl_chart: ^0.68.0

  # Local Storage
  shared_preferences: ^2.2.3

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
